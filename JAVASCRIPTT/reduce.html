<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const num = [11, 22, 33, 44, 55, 66];

        const even = num.filter((i) => (i % 2 == 0));

        const square = even.map((i) => (i * i));

        const sum = square.reduce((i, j) => i + j);             //  reduce() is an array function in JavaScript that is used to reduce multiple array elements into a single value. For example, we can use it to calculate the sum, product, maximum, or minimum of all elements in an array.”

        console.log("sum==", sum);
    </script>
</body>
</html>
